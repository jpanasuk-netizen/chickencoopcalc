<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Coop calculator flow</title>
  <desc id="d">Bird count goes to the standard rate of 4 square feet of coop and 10 of run, or the bantam rate of 2 and 8. Six standard birds are 24 and 60 square feet.</desc>
  <rect width="720" height="300" fill="#f6f8fa"/>
  <g font-family="system-ui,Segoe UI,sans-serif" fill="#1f2328">
    <rect x="24" y="110" width="150" height="72" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <text x="99" y="142" text-anchor="middle" font-size="16" font-weight="700">Bird count</text>
    <text x="99" y="164" text-anchor="middle" font-size="14">you enter</text>
    <path d="M174 146 H210" stroke="#1f2328" stroke-width="2" fill="none"/>
    <path d="M202 138 L214 146 L202 154" fill="#1f2328"/>
    <rect x="220" y="36" width="230" height="88" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <text x="335" y="62" text-anchor="middle" font-size="15" font-weight="700">Standard</text>
    <text x="335" y="84" text-anchor="middle" font-size="14">4 sq ft coop</text>
    <text x="335" y="104" text-anchor="middle" font-size="14">10 sq ft run</text>
    <rect x="220" y="168" width="230" height="88" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <text x="335" y="194" text-anchor="middle" font-size="15" font-weight="700">Bantam</text>
    <text x="335" y="216" text-anchor="middle" font-size="14">2 sq ft coop</text>
    <text x="335" y="236" text-anchor="middle" font-size="14">8 sq ft run</text>
    <path d="M450 80 H486" stroke="#1f2328" stroke-width="2" fill="none"/>
    <path d="M478 72 L490 80 L478 88" fill="#1f2328"/>
    <rect x="496" y="36" width="200" height="88" rx="8" fill="#eaf5ea" stroke="#1f2328" stroke-width="2"/>
    <text x="596" y="64" text-anchor="middle" font-size="14" font-weight="700">6 standard birds</text>
    <text x="596" y="86" text-anchor="middle" font-size="14">24 sq ft coop</text>
    <text x="596" y="106" text-anchor="middle" font-size="14">60 sq ft run</text>
  </g>
</svg>
