<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">Six-hen coop and run</title>
  <desc id="d">A 4 by 6 foot coop is 24 square feet. A 6 by 10 foot run is 60 square feet. Both rectangles use the same scale.</desc>
  <rect width="720" height="280" fill="#f6f8fa"/>
  <g font-family="system-ui,Segoe UI,sans-serif" fill="#1f2328">
    <text x="106" y="36" text-anchor="middle" font-size="13">6 ft</text>
    <text x="24" y="100" font-size="13">4 ft</text>
    <rect x="48" y="48" width="132" height="88" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <text x="114" y="82" text-anchor="middle" font-size="15" font-weight="700">Coop</text>
    <text x="114" y="102" text-anchor="middle" font-size="13">24 sq ft</text>
    <text x="114" y="156" text-anchor="middle" font-size="14">4 ft × 6 ft</text>
    <text x="430" y="28" text-anchor="middle" font-size="13">10 ft</text>
    <text x="250" y="120" font-size="13">6 ft</text>
    <rect x="290" y="40" width="220" height="132" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <text x="400" y="98" text-anchor="middle" font-size="15" font-weight="700">Run</text>
    <text x="400" y="118" text-anchor="middle" font-size="13">60 sq ft</text>
    <text x="400" y="198" text-anchor="middle" font-size="14">6 ft × 10 ft</text>
    <text x="40" y="248" font-size="14">Same scale. Six hens at 4 sq ft inside and 10 sq ft of run.</text>
  </g>
</svg>
